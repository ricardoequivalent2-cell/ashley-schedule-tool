<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>애슐리 진단 · 관리자 종합현황</title>
  <link rel="stylesheet" href="./css/dashboard.css">
<style>
  *{box-sizing:border-box}
  body{margin:0}
  .admin-page{padding-bottom:36px}
  .admin-title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:18px}
  .admin-title-copy{min-width:0}
  .admin-page-title{font-size:24px;font-weight:800;color:#232938;line-height:1.25;margin-bottom:6px}
  .admin-page-sub{font-size:13px;color:#8B93A5;line-height:1.6}
  .admin-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
  .admin-toolbar select,.admin-toolbar input{
    height:40px;border:1px solid #D9DEE8;border-radius:9px;background:#fff;
    color:#30384A;padding:0 12px;font-size:13px;outline:none
  }
  .admin-toolbar select{min-width:230px}
  .admin-toolbar input{width:250px}
  .admin-refresh{
    height:40px;padding:0 14px;border:1px solid #D9DEE8;border-radius:9px;
    background:#fff;color:#4E5668;font-size:13px;font-weight:700;cursor:pointer
  }
  #status{margin-left:auto;color:#8B93A5;font-size:12px}
  .admin-kpi-row{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px
  }
  .admin-kpi{
    background:#fff;border:1px solid #E5E8EE;border-radius:12px;padding:17px 18px
  }
  .admin-kpi-label{font-size:12px;color:#8B93A5;margin-bottom:8px}
  .admin-kpi-value{font-size:25px;font-weight:800;color:#252B39;letter-spacing:-.4px}
  .admin-kpi-hint{font-size:11px;color:#A7AEBD;margin-top:5px}
  .admin-table-card{
    background:#fff;border:1px solid #E5E8EE;border-radius:12px;overflow:hidden
  }
  .admin-table-head{
    padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid #EEF0F4
  }
  .admin-table-title{font-size:14px;font-weight:800;color:#30384A}
  .admin-table-wrap{overflow:auto}
  .admin-table{border-collapse:collapse;width:100%;min-width:1160px}
  .admin-table th,.admin-table td{
    border-bottom:1px solid #EEF0F4;padding:13px 12px;text-align:right;white-space:nowrap;font-size:12px
  }
  .admin-table th{background:#FAFBFC;color:#8B93A5;font-weight:700}
  .admin-table th:first-child,.admin-table td:first-child{text-align:left}
  .admin-table tbody tr:hover{background:#FAFBFF}
  .admin-table tbody tr:last-child td{border-bottom:0}
  .store{font-weight:800;color:#272D3A}
  .gap-plus{color:#D6452F;font-weight:800}
  .gap-minus{color:#17845B;font-weight:800}
  .gap-zero{color:#566071;font-weight:800}
  .pill{
    display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;
    background:#F1F3F7;color:#667085;font-size:11px;font-weight:700
  }
  .empty{padding:50px 16px !important;text-align:center !important;color:#A7AEBD}
  .admin-nav-link{
    padding:11px 12px;font-size:13px;color:rgba(255,255,255,.55);text-decoration:none;
    border-radius:10px;display:block
  }
  .admin-nav-link:hover{background:rgba(255,255,255,.06);color:#fff}
  @media(max-width:900px){
    .admin-kpi-row{grid-template-columns:repeat(2,1fr)}
    #status{width:100%;margin-left:0}
  }
</style>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <div class="sidebar-brand">애슐리 진단</div>
    <div class="sidebar-sub">스케줄링 사전 피드백</div>

    <div class="sidebar-section-label">Administrator</div>
    <button class="nav-btn active" type="button">종합현황</button>

    <div class="sidebar-spacer"></div>
    <div class="sidebar-divider"></div>
    <a class="admin-nav-link" href="/">매장 진단으로</a>
  </nav>

  <main class="main-content">
    <div class="admin-page">
      <div class="admin-title-row">
        <div class="admin-title-copy">
          <div class="admin-page-title">종합현황</div>
          <div class="admin-page-sub">매장에서 진단한 스케줄 결과를 주차별로 모아 비교합니다.</div>
        </div>
      </div>

      <div class="admin-toolbar">
        <select id="weekSelect"></select>
        <input id="searchInput" type="text" placeholder="매장 검색">
        <button class="admin-refresh" id="refreshBtn">새로고침</button>
        <div id="status">불러오는 중...</div>
      </div>

      <div class="admin-kpi-row">
        <div class="admin-kpi">
          <div class="admin-kpi-label">저장 매장</div>
          <div class="admin-kpi-value" id="kpiStores">-</div>
          <div class="admin-kpi-hint">선택 주차 기준</div>
        </div>
        <div class="admin-kpi">
          <div class="admin-kpi-label">전체 실제인시</div>
          <div class="admin-kpi-value" id="kpiActual">-</div>
          <div class="admin-kpi-hint">전 매장 합계</div>
        </div>
        <div class="admin-kpi">
          <div class="admin-kpi-label">전체 표준인시</div>
          <div class="admin-kpi-value" id="kpiStandard">-</div>
          <div class="admin-kpi-hint">전 매장 합계</div>
        </div>
        <div class="admin-kpi">
          <div class="admin-kpi-label">전체 Gap</div>
          <div class="admin-kpi-value" id="kpiGap">-</div>
          <div class="admin-kpi-hint">실제 - 표준</div>
        </div>
      </div>

      <div class="admin-table-card">
        <div class="admin-table-head">
          <div class="admin-table-title">매장별 주간 현황</div>
        </div>
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>매장</th>
                <th>예상매출</th>
                <th>객수</th>
                <th>실제인시</th>
                <th>표준인시</th>
                <th>Gap</th>
                <th>Gap%</th>
                <th>주방 Gap</th>
                <th>홀 Gap</th>
                <th>모델</th>
                <th>최종 저장</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
let allRows = [];
let weeks = [];

const n1 = v => Number(v || 0).toLocaleString('ko-KR', { maximumFractionDigits: 1 });
const won = v => Math.round(Number(v || 0)).toLocaleString('ko-KR') + '원';
const sales = v => {
  const n = Number(v || 0);
  if (n >= 100000000) return (n / 100000000).toFixed(2) + '억';
  if (n >= 10000) return Math.round(n / 10000).toLocaleString('ko-KR') + '만';
  return Math.round(n).toLocaleString('ko-KR');
};
const gapClass = v => Number(v) > 0 ? 'gap-plus' : Number(v) < 0 ? 'gap-minus' : 'gap-zero';
const sign1 = v => {
  const n = Number(v || 0);
  return (n > 0 ? '+' : '') + n1(n) + 'h';
};
const pct = v => {
  if (v === null || v === undefined || Number.isNaN(Number(v))) return '-';
  const n = Number(v);
  return (n > 0 ? '+' : '') + n.toFixed(1) + '%';
};
const formatSavedAt = iso => {
  if (!iso) return '-';
  return new Intl.DateTimeFormat('ko-KR', {
    month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
    hour12: false
  }).format(new Date(iso));
};

async function loadData() {
  const status = document.getElementById('status');
  status.textContent = '불러오는 중...';

  try {
    const res = await fetch('/api/admin-weekly-summary');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '조회 실패');

    allRows = data.rows || [];
    weeks = data.weeks || [];

    renderWeekOptions();
    render();
    status.textContent = `총 ${allRows.length}개 주차별 매장 데이터`;
  } catch (err) {
    status.textContent = '오류: ' + err.message;
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="11" class="empty">데이터를 불러오지 못했습니다.</td></tr>`;
  }
}

function renderWeekOptions() {
  const select = document.getElementById('weekSelect');
  const current = select.value;
  select.innerHTML = '';

  if (!weeks.length) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '저장된 주차 없음';
    select.appendChild(opt);
    return;
  }

  weeks.forEach((week, i) => {
    const opt = document.createElement('option');
    opt.value = week.weekStart;
    opt.textContent = week.weekLabel;
    if ((current && current === week.weekStart) || (!current && i === 0)) {
      opt.selected = true;
    }
    select.appendChild(opt);
  });
}

function selectedRows() {
  const weekStart = document.getElementById('weekSelect').value;
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

  return allRows.filter(row => {
    const sameWeek = !weekStart || row.week_start === weekStart;
    const matches = !keyword || String(row.store_name || '').toLowerCase().includes(keyword);
    return sameWeek && matches;
  });
}

function render() {
  const rows = selectedRows();

  const actual = rows.reduce((s, r) => s + Number(r.actual_hours || 0), 0);
  const standard = rows.reduce((s, r) => s + Number(r.standard_hours || 0), 0);
  const gap = actual - standard;

  document.getElementById('kpiStores').textContent = rows.length + '개';
  document.getElementById('kpiActual').textContent = n1(actual) + 'h';
  document.getElementById('kpiStandard').textContent = n1(standard) + 'h';

  const kpiGap = document.getElementById('kpiGap');
  kpiGap.textContent = sign1(gap);
  kpiGap.className = 'value ' + gapClass(gap);

  const body = document.getElementById('tableBody');

  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="11" class="empty">선택한 주차에 저장된 매장이 없습니다.</td></tr>`;
    return;
  }

  body.innerHTML = rows.map(row => `
    <tr>
      <td><span class="store">${escapeHtml(row.store_name || '-')}</span></td>
      <td>${sales(row.expected_sales)}</td>
      <td>${Math.round(Number(row.guest_count || 0)).toLocaleString('ko-KR')}</td>
      <td>${n1(row.actual_hours)}h</td>
      <td>${n1(row.standard_hours)}h</td>
      <td class="${gapClass(row.gap_hours)}">${sign1(row.gap_hours)}</td>
      <td class="${gapClass(row.gap_pct)}">${pct(row.gap_pct)}</td>
      <td class="${gapClass(row.kitchen_gap_hours)}">${sign1(row.kitchen_gap_hours)}</td>
      <td class="${gapClass(row.hall_gap_hours)}">${sign1(row.hall_gap_hours)}</td>
      <td><span class="pill">V${escapeHtml(row.model_version || '-')}</span></td>
      <td>${formatSavedAt(row.updated_at || row.saved_at)}</td>
    </tr>
  `).join('');
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

document.getElementById('weekSelect').addEventListener('change', render);
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('refreshBtn').addEventListener('click', loadData);

loadData();
</script>
</body>
</html>
