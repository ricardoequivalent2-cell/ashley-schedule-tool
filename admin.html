<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>애슐리 스케줄링 진단 - 관리자 페이지</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; margin: 24px; color: #333; background: #fafaf7; }
  h2 { margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 20px; }
  #status { font-size: 13px; color: #666; margin-bottom: 16px; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
  .toolbar input { flex: 1; max-width: 320px; padding: 8px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  .toolbar button { padding: 8px 16px; background: #4a6cf7; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }

  .store-list { display: flex; flex-direction: column; gap: 8px; }
  .store-row {
    display: flex; align-items: center; gap: 20px;
    border-radius: 10px; padding: 14px 20px; border: 1px solid #e2e2e2; background: white;
    text-decoration: none; color: inherit; cursor: pointer; transition: box-shadow 0.15s;
  }
  .store-row:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-color: #bbb; }
  .store-row.has-issue { background: #fdecea; border-color: #f1b0aa; }
  .store-row.ok { background: #eafaf1; border-color: #a9dfbf; }

  .col-name { width: 180px; flex-shrink: 0; font-size: 15px; font-weight: bold; color: #1c2733; }
  .col-headline { flex: 1.6; font-size: 13px; color: #444; line-height: 1.4; }
  .col-numbers { flex: 1; font-size: 12px; color: #666; }
  .col-savedat { width: 150px; flex-shrink: 0; font-size: 11px; color: #aaa; text-align: right; }
  .col-arrow { width: 20px; flex-shrink: 0; color: #ccc; font-size: 16px; }

  .list-header {
    display: flex; align-items: center; gap: 20px; padding: 0 20px 8px 20px;
    font-size: 11px; color: #999; font-weight: bold;
  }
  .list-header .col-name { width: 180px; }
  .list-header .col-headline { flex: 1.6; }
  .list-header .col-numbers { flex: 1; }
  .list-header .col-savedat { width: 150px; text-align: right; }
  .list-header .col-arrow { width: 20px; }

  .empty-msg { color: #888; font-size: 14px; padding: 40px 0; text-align: center; }
</style>
</head>
<body>

<h2>🗂️ 애슐리 스케줄링 진단 - 관리자 페이지</h2>
<div class="sub">각 매장에서 저장한 진단 결과를 한 화면에서 모아봅니다. 매장을 클릭하면 상세 대시보드로 이동합니다.</div>
<div id="status">불러오는 중...</div>

<div id="brandKpiCards"></div>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="매장명으로 검색...">
  <button id="refreshBtn">🔄 새로고침</button>
</div>

<div class="list-header">
  <div class="col-name">매장명</div>
  <div class="col-headline">헤드라인</div>
  <div class="col-numbers">사용시간 / 목표 / 판정</div>
  <div class="col-savedat">저장일시</div>
  <div class="col-arrow"></div>
</div>
<div class="store-list" id="storeList"></div>

<script>
let allStores = [];

async function loadStores() {
  const statusEl = document.getElementById('status');
  statusEl.textContent = '불러오는 중...';
  try {
    const res = await fetch('/api/list');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '불러오기 실패');
    allStores = data.stores || [];
    statusEl.textContent = '총 ' + allStores.length + '개 매장 저장됨';
    renderBrandKPICards(allStores);
    renderList(allStores);
  } catch (err) {
    statusEl.textContent = '오류: ' + err.message;
  }
}

function computeOverHours(r) {
  if (!r) return 0;
  let total = 0;
  (r.weeklyBlockSummary || []).forEach(b => { if (b.verdict === '과다') total += b.netDiffHours; });
  (r.weeklyHallBlockSummary || []).forEach(b => { if (b.verdict === '과다') total += b.netDiffHours; });
  return Math.round(total * 10) / 10;
}

function renderBrandKPICards(stores) {
  const container = document.getElementById('brandKpiCards');
  if (!stores.length) { container.innerHTML = ''; return; }

  const withResult = stores.filter(s => s.result);
  const problemStores = withResult.filter(s => computeOverHours(s.result) > 0);
  const problemCount = problemStores.length;
  const okRatio = withResult.length ? Math.round((withResult.length - problemCount) / withResult.length * 100) : 0;

  // 매장별 목표대비 비율 평균
  const ratios = withResult.map(s => (s.weeklySummary && s.weeklySummary.totalActual > 0 ? s.weeklySummary.totalTarget1 / s.weeklySummary.totalActual * 100 : null)).filter(v => v !== null);
  const avgRatio = ratios.length ? Math.round(ratios.reduce((a, b) => a + b, 0) / ratios.length * 10) / 10 : 0;

  // 가장 심각한 매장 (과다시간 최대)
  let worstStore = null, worstOverHours = -Infinity;
  withResult.forEach(s => { const oh = computeOverHours(s.result); if (oh > worstOverHours) { worstOverHours = oh; worstStore = s; } });

  // 문제 몰린 시간대 (매장별 가장 심한 블록명 집계)
  const blockCount = {};
  withResult.forEach(s => {
    const cands = [];
    (s.result.weeklyBlockSummary || []).forEach(b => { if (b.verdict === '과다') cands.push({ block: b.name, diff: b.netDiffHours }); });
    (s.result.weeklyHallBlockSummary || []).forEach(b => { if (b.verdict === '과다') cands.push({ block: b.name, diff: b.netDiffHours }); });
    if (!cands.length) return;
    cands.sort((a, b) => b.diff - a.diff);
    const top = cands[0].block;
    blockCount[top] = (blockCount[top] || 0) + 1;
  });
  let topBlockName = '-', topBlockCount = 0;
  Object.keys(blockCount).forEach(k => { if (blockCount[k] > topBlockCount) { topBlockCount = blockCount[k]; topBlockName = k; } });

  container.innerHTML =
    '<div style="background:#F5F6F8; padding:18px; border-radius:8px; margin-bottom:20px;">' +
      '<div style="display:flex; gap:14px; margin-bottom:14px;">' +
        '<div style="flex:1; background:#EF5350; border-radius:6px; padding:14px 16px;">' +
          '<p style="font-size:13px; color:#fff; margin:0 0 6px; font-weight:500;">문제 매장</p>' +
          '<p style="font-size:12px; color:rgba(255,255,255,0.85); margin:0;">' + problemCount + '개 / ' + withResult.length + '개 매장</p>' +
        '</div>' +
        '<div style="flex:1; background:#FFA726; border-radius:6px; padding:14px 16px;">' +
          '<p style="font-size:13px; color:#fff; margin:0 0 6px; font-weight:500;">문제 몰린 시간대</p>' +
          '<p style="font-size:12px; color:rgba(255,255,255,0.85); margin:0;">' + topBlockName + ' · ' + topBlockCount + '개 매장에서 반복</p>' +
        '</div>' +
        '<div style="flex:1; background:#66BB6A; border-radius:6px; padding:14px 16px;">' +
          '<p style="font-size:13px; color:#fff; margin:0 0 6px; font-weight:500;">전체 평균 목표대비</p>' +
          '<p style="font-size:12px; color:rgba(255,255,255,0.85); margin:0;">' + avgRatio + '점</p>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex; gap:14px;">' +
        '<div style="flex:1; background:#fff; border-radius:6px; padding:12px 14px; display:flex; gap:10px; align-items:center;">' +
          '<div><p style="font-size:10px; color:#9AA0A8; margin:0;">문제 매장</p><p style="font-size:15px; color:#3C4858; margin:1px 0 0; font-weight:500;">' + problemCount + '개</p></div>' +
        '</div>' +
        '<div style="flex:1; background:#fff; border-radius:6px; padding:12px 14px; display:flex; gap:10px; align-items:center;">' +
          '<div><p style="font-size:10px; color:#9AA0A8; margin:0;">가장 심각한 매장</p><p style="font-size:13px; color:#3C4858; margin:1px 0 0; font-weight:500;">' + (worstStore ? worstStore.storeName + ' +' + worstOverHours + 'h' : '-') + '</p></div>' +
        '</div>' +
        '<div style="flex:1; background:#fff; border-radius:6px; padding:12px 14px; display:flex; gap:10px; align-items:center;">' +
          '<div><p style="font-size:10px; color:#9AA0A8; margin:0;">정상 매장 비율</p><p style="font-size:15px; color:#3C4858; margin:1px 0 0; font-weight:500;">' + okRatio + '%</p></div>' +
        '</div>' +
        '<div style="flex:1; background:#fff; border-radius:6px; padding:12px 14px; display:flex; gap:10px; align-items:center;">' +
          '<div><p style="font-size:10px; color:#9AA0A8; margin:0;">전주 대비</p><p style="font-size:12px; color:#3C4858; margin:1px 0 0;">데이터 축적 중</p></div>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function renderList(stores) {
  const listEl = document.getElementById('storeList');
  if (!stores.length) {
    listEl.innerHTML = '<div class="empty-msg">아직 저장된 매장이 없습니다. 각 매장에서 진단 후 "결과 저장"을 눌러주세요.</div>';
    return;
  }
  listEl.innerHTML = stores.map(s => {
    const hasIssue = s.headline && s.headline.indexOf('✅') === -1;
    const cls = hasIssue ? 'has-issue' : 'ok';
    const w = s.weeklySummary || {};
    const savedDate = s.savedAt ? new Date(s.savedAt).toLocaleString('ko-KR') : '-';
    const numbersText = (w.totalActual !== undefined)
      ? (w.totalActual + 'h / ' + w.totalTarget1 + 'h · ' + (w.verdict || ''))
      : '-';
    const href = 'index.html?store=' + encodeURIComponent(s.storeName);
    return '<a class="store-row ' + cls + '" href="' + href + '">' +
      '<div class="col-name">' + s.storeName + '</div>' +
      '<div class="col-headline">' + (s.headline || '(요약 없음)') + '</div>' +
      '<div class="col-numbers">' + numbersText + '</div>' +
      '<div class="col-savedat">' + savedDate + '</div>' +
      '<div class="col-arrow">›</div>' +
    '</a>';
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  const q = e.target.value.trim();
  const filtered = q ? allStores.filter(s => s.storeName.indexOf(q) !== -1) : allStores;
  renderList(filtered);
});
document.getElementById('refreshBtn').addEventListener('click', loadStores);

loadStores();
</script>
</body>
</html>
