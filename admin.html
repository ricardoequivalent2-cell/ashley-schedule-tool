<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>애슐리 스케줄 인건비 모니터</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    color: #182230;
    background: #f6f7f4;
  }
  .topbar {
    background: #fff;
    border-bottom: 1px solid #e4e7ec;
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .brand { display: flex; gap: 14px; align-items: center; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: #182230; color: white;
    display: grid; place-items: center;
    font-size: 20px; font-weight: 800;
  }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: #667085; font-size: 13px; }
  .back {
    text-decoration: none; color: #344054; font-weight: 700;
    border: 1px solid #d0d5dd; border-radius: 10px; padding: 10px 14px;
    background: white;
  }
  main { padding: 24px 28px 40px; max-width: 1680px; margin: 0 auto; }
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    margin-bottom: 18px;
  }
  select, input {
    height: 42px; border: 1px solid #d0d5dd; border-radius: 9px;
    background: white; padding: 0 12px; font-size: 14px;
  }
  #weekSelect { min-width: 230px; }
  #searchInput { width: 260px; }
  .refresh {
    height: 42px; border: 1px solid #d0d5dd; border-radius: 9px;
    background: white; padding: 0 14px; cursor: pointer; font-weight: 700;
  }
  #status { margin-left: auto; color: #667085; font-size: 13px; }
  .cards {
    display: grid; grid-template-columns: repeat(4, minmax(180px,1fr));
    gap: 14px; margin-bottom: 18px;
  }
  .card {
    background: white; border: 1px solid #e4e7ec; border-radius: 14px;
    padding: 18px 20px;
  }
  .card .label { color: #667085; font-size: 13px; margin-bottom: 8px; }
  .card .value { font-size: 28px; font-weight: 800; }
  .card .hint { color: #98a2b3; font-size: 12px; margin-top: 4px; }
  .table-wrap {
    background: white; border: 1px solid #e4e7ec; border-radius: 14px;
    overflow: auto;
  }
  table {
    border-collapse: collapse; width: 100%; min-width: 1280px;
  }
  th, td {
    border-bottom: 1px solid #eaecf0;
    padding: 12px 11px; text-align: right; white-space: nowrap;
    font-size: 13px;
  }
  th {
    position: sticky; top: 0; z-index: 1;
    background: #fcfcfd; color: #667085; font-size: 12px;
  }
  th:first-child, td:first-child { text-align: left; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #fafafa; }
  .store { font-weight: 800; color: #101828; }
  .gap-plus { color: #d92d20; font-weight: 800; }
  .gap-minus { color: #067647; font-weight: 800; }
  .gap-zero { color: #475467; font-weight: 800; }
  .empty { padding: 54px 20px; text-align: center; color: #98a2b3; }
  .pill {
    display: inline-flex; padding: 4px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700; background: #f2f4f7; color: #475467;
  }
  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    #status { width: 100%; margin-left: 0; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">A</div>
    <div>
      <h1>애슐리 스케줄 인건비 모니터</h1>
      <div class="sub">매장에서 진단한 결과를 주차별로 모아봅니다.</div>
    </div>
  </div>
  <a class="back" href="/">매장 진단으로</a>
</header>

<main>
  <div class="toolbar">
    <select id="weekSelect"></select>
    <input id="searchInput" type="text" placeholder="매장 검색">
    <button class="refresh" id="refreshBtn">새로고침</button>
    <div id="status">불러오는 중...</div>
  </div>

  <section class="cards">
    <div class="card">
      <div class="label">저장 매장</div>
      <div class="value" id="kpiStores">-</div>
      <div class="hint">선택 주차 기준</div>
    </div>
    <div class="card">
      <div class="label">전체 실제인시</div>
      <div class="value" id="kpiActual">-</div>
      <div class="hint">전 매장 합계</div>
    </div>
    <div class="card">
      <div class="label">전체 표준인시</div>
      <div class="value" id="kpiStandard">-</div>
      <div class="hint">전 매장 합계</div>
    </div>
    <div class="card">
      <div class="label">전체 Gap</div>
      <div class="value" id="kpiGap">-</div>
      <div class="hint">실제 - 표준</div>
    </div>
  </section>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>매장</th>
          <th>예상매출</th>
          <th>객수</th>
          <th>실제인시</th>
          <th>표준인시</th>
          <th>Gap</th>
          <th>Gap%</th>
          <th>주방 Gap</th>
          <th>홀 Gap</th>
          <th>인시생산성</th>
          <th>모델</th>
          <th>최종 저장</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<script>
let allRows = [];
let weeks = [];

const n1 = v => Number(v || 0).toLocaleString('ko-KR', { maximumFractionDigits: 1 });
const won = v => Math.round(Number(v || 0)).toLocaleString('ko-KR') + '원';
const sales = v => {
  const n = Number(v || 0);
  if (n >= 100000000) return (n / 100000000).toFixed(2) + '억';
  if (n >= 10000) return Math.round(n / 10000).toLocaleString('ko-KR') + '만';
  return Math.round(n).toLocaleString('ko-KR');
};
const gapClass = v => Number(v) > 0 ? 'gap-plus' : Number(v) < 0 ? 'gap-minus' : 'gap-zero';
const sign1 = v => {
  const n = Number(v || 0);
  return (n > 0 ? '+' : '') + n1(n) + 'h';
};
const pct = v => {
  if (v === null || v === undefined || Number.isNaN(Number(v))) return '-';
  const n = Number(v);
  return (n > 0 ? '+' : '') + n.toFixed(1) + '%';
};
const formatSavedAt = iso => {
  if (!iso) return '-';
  return new Intl.DateTimeFormat('ko-KR', {
    month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit',
    hour12: false
  }).format(new Date(iso));
};

async function loadData() {
  const status = document.getElementById('status');
  status.textContent = '불러오는 중...';

  try {
    const res = await fetch('/api/admin-weekly-summary');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '조회 실패');

    allRows = data.rows || [];
    weeks = data.weeks || [];

    renderWeekOptions();
    render();
    status.textContent = `총 ${allRows.length}개 주차별 매장 데이터`;
  } catch (err) {
    status.textContent = '오류: ' + err.message;
    document.getElementById('tableBody').innerHTML =
      `<tr><td colspan="12" class="empty">데이터를 불러오지 못했습니다.</td></tr>`;
  }
}

function renderWeekOptions() {
  const select = document.getElementById('weekSelect');
  const current = select.value;
  select.innerHTML = '';

  if (!weeks.length) {
    const opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '저장된 주차 없음';
    select.appendChild(opt);
    return;
  }

  weeks.forEach((week, i) => {
    const opt = document.createElement('option');
    opt.value = week.weekStart;
    opt.textContent = week.weekLabel;
    if ((current && current === week.weekStart) || (!current && i === 0)) {
      opt.selected = true;
    }
    select.appendChild(opt);
  });
}

function selectedRows() {
  const weekStart = document.getElementById('weekSelect').value;
  const keyword = document.getElementById('searchInput').value.trim().toLowerCase();

  return allRows.filter(row => {
    const sameWeek = !weekStart || row.week_start === weekStart;
    const matches = !keyword || String(row.store_name || '').toLowerCase().includes(keyword);
    return sameWeek && matches;
  });
}

function render() {
  const rows = selectedRows();

  const actual = rows.reduce((s, r) => s + Number(r.actual_hours || 0), 0);
  const standard = rows.reduce((s, r) => s + Number(r.standard_hours || 0), 0);
  const gap = actual - standard;

  document.getElementById('kpiStores').textContent = rows.length + '개';
  document.getElementById('kpiActual').textContent = n1(actual) + 'h';
  document.getElementById('kpiStandard').textContent = n1(standard) + 'h';

  const kpiGap = document.getElementById('kpiGap');
  kpiGap.textContent = sign1(gap);
  kpiGap.className = 'value ' + gapClass(gap);

  const body = document.getElementById('tableBody');

  if (!rows.length) {
    body.innerHTML = `<tr><td colspan="12" class="empty">선택한 주차에 저장된 매장이 없습니다.</td></tr>`;
    return;
  }

  body.innerHTML = rows.map(row => `
    <tr>
      <td><span class="store">${escapeHtml(row.store_name || '-')}</span></td>
      <td>${sales(row.expected_sales)}</td>
      <td>${Math.round(Number(row.guest_count || 0)).toLocaleString('ko-KR')}</td>
      <td>${n1(row.actual_hours)}h</td>
      <td>${n1(row.standard_hours)}h</td>
      <td class="${gapClass(row.gap_hours)}">${sign1(row.gap_hours)}</td>
      <td class="${gapClass(row.gap_pct)}">${pct(row.gap_pct)}</td>
      <td class="${gapClass(row.kitchen_gap_hours)}">${sign1(row.kitchen_gap_hours)}</td>
      <td class="${gapClass(row.hall_gap_hours)}">${sign1(row.hall_gap_hours)}</td>
      <td>${won(row.labor_productivity)}</td>
      <td><span class="pill">V${escapeHtml(row.model_version || '-')}</span></td>
      <td>${formatSavedAt(row.updated_at || row.saved_at)}</td>
    </tr>
  `).join('');
}

function escapeHtml(value) {
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

document.getElementById('weekSelect').addEventListener('change', render);
document.getElementById('searchInput').addEventListener('input', render);
document.getElementById('refreshBtn').addEventListener('click', loadData);

loadData();
</script>
</body>
</html>
