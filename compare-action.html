<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>FINAL Action Golden Test</title>
<style>
body{font-family:Arial,sans-serif;margin:28px;color:#1f2937;max-width:1180px}input,button{padding:8px 10px}button{cursor:pointer}table{border-collapse:collapse;margin-top:18px;width:100%}th,td{border:1px solid #ddd;padding:8px 10px;text-align:right}th:first-child,td:first-child{text-align:left}.ok{color:#087443}.bad{color:#c62828}.pass{background:#e8f3ec;color:#236a46;font-weight:700}.fail{background:#fbebeb;color:#b42318;font-weight:700}.summary{margin:16px 0;padding:14px 16px;border-radius:8px;font-weight:700}.summary.pass{border:1px solid #b7ddc6}.summary.fail{border:1px solid #efb4b4}.muted{color:#667085;font-size:13px}.section{margin-top:34px;padding-top:20px;border-top:1px solid #e5e7eb}.num{font-variant-numeric:tabular-nums}
</style></head><body>
<h2>FINAL Action 계산 엔진 Golden Test</h2>
<p>FINAL 엑셀 <b>04_매출별_예시</b>의 500만 / 1,000만 / 2,000만 / 3,000만 / 4,000만원을 코드 결과와 자동 대조합니다.</p>
<button id="goldenRun">5개 Golden Test 실행</button><span id="goldenStatus"></span><div id="goldenOut"></div>
<div class="section"><h3>단일 매출 상세 확인</h3><input id="sales" type="number" value="10000000" step="1000000"><button id="run">계산</button><span id="status"></span><div id="out"></div></div>
<script src="./js/diagnosis-engine.js"></script><script src="./js/config-source.js"></script><script src="./js/part-allocation-source.js"></script><script src="./js/action-standard-engine.js"></script><script src="./js/action-golden-test.js"></script>
<script>
function f(n,d=6){return Number(n).toLocaleString('ko-KR',{maximumFractionDigits:d});}
async function runGolden(){const s=document.getElementById('goldenStatus'),out=document.getElementById('goldenOut');try{s.textContent=' 로딩 중...';out.innerHTML='';const g=await runFinalActionGoldenTests(1e-6);s.textContent=g.pass?' ✓ ALL PASS':' ✕ FAIL';s.className=g.pass?'ok':'bad';let html=`<div class="summary ${g.pass?'pass':'fail'}">${g.pass?'PASS — 5개 매출구간 전 항목이 FINAL 엑셀과 일치합니다.':'FAIL — FINAL 엑셀과 불일치가 있습니다.'} <span class="muted">허용오차 ${g.tolerance}</span></div>`;html+='<table><tr><th>매출</th><th>결과</th><th>최대 오차</th><th>Action 최소</th><th>Action 1차</th><th>Action 가이드라인</th></tr>';for(const x of g.results){const maxDiff=Math.max(...Object.values(x.diffs));html+=`<tr class="${x.pass?'pass':'fail'}"><td>${f(x.salesWon/10000,0)}만원</td><td>${x.pass?'PASS':'FAIL'}</td><td class="num">${maxDiff.toExponential(3)}</td><td>${f(x.actual.actionMinimum)}h</td><td>${f(x.actual.actionTarget1)}h</td><td>${f(x.actual.actionGuideline)}h</td></tr>`;}html+='</table>';out.innerHTML=html;}catch(e){s.textContent=' 오류: '+e.message;s.className='bad';}}
async function run(){const s=document.getElementById('status'),out=document.getElementById('out');try{s.textContent=' 로딩 중...';const r=await calculateFinalActionStandardReady(Number(document.getElementById('sales').value));s.textContent=' ✓ '+r.sourceVersion;s.className='ok';out.innerHTML=`<table><tr><th>항목</th><th>값</th></tr><tr><td>매출</td><td>${f(r.salesWon,0)}원</td></tr><tr><td>객단가</td><td>${f(r.guestUnitPrice,0)}원</td></tr><tr><td>일객수</td><td>${f(r.guests)}</td></tr><tr><td>주간객수</td><td>${f(r.weeklyGuests,0)}</td></tr><tr><td>V1 최소</td><td>${f(r.v1.minimum)}h</td></tr><tr><td>V1 1차</td><td>${f(r.v1.target1)}h</td></tr><tr><td>V1 가이드라인</td><td>${f(r.v1.guideline)}h</td></tr><tr><td>스시 절감</td><td>${f(r.sushi.total)}h</td></tr><tr><td>베이커리 최소 절감</td><td>${f(r.bakerySaving.minimum)}h</td></tr><tr><td>베이커리 1차 절감</td><td>${f(r.bakerySaving.target1)}h</td></tr><tr><td>베이커리 가이드라인 절감</td><td>${f(r.bakerySaving.guideline)}h</td></tr><tr><td><b>Action 최소</b></td><td><b>${f(r.action.minimum)}h</b></td></tr><tr><td><b>Action 1차</b></td><td><b>${f(r.action.target1)}h</b></td></tr><tr><td><b>Action 가이드라인</b></td><td><b>${f(r.action.guideline)}h</b></td></tr></table>`;}catch(e){s.textContent=' 오류: '+e.message;s.className='bad';}}
document.getElementById('goldenRun').onclick=runGolden;document.getElementById('run').onclick=run;
</script></body></html>
